; PLAN section 8: mypy strict, warn_unreachable, extra error codes,
; disallow_any_explicit in core and planner, plus disallow_any_expr in core.
[mypy]
python_version = 3.14
mypy_path = src
packages = wiggle_outside
strict = True
warn_unreachable = True
enable_error_code = truthy-bool, truthy-iterable, redundant-expr, possibly-undefined, redundant-self, unimported-reveal, ignore-without-code, explicit-override, mutable-override
warn_no_return = True
strict_equality = True
extra_checks = True

[mypy-wiggle_outside.core.*]
disallow_any_explicit = True
disallow_any_expr = True

[mypy-wiggle_outside.planner.*]
disallow_any_explicit = True
