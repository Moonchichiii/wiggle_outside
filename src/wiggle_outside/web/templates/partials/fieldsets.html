{# The plan form's fieldsets (DESIGN-SPEC sections 2, 6 and 9). Every string comes from
   web/copy.py; every control is inside a <label> or named by its <legend>.
   Keyboard order: who, ages, time, energy, where, location, interests, submit. #}
{% from "macros/tile.html" import tiles %}
{% from "macros/field.html" import text_field, field_error, bare_text_field %}
{% from "macros/icon.html" import icon %}
{% from "partials/error_summary.html" import error_summary with context %}

{% macro described_by(hint_id, anchor, error) -%}
{%- if hint_id and error %}{{ hint_id }} {{ anchor }}-error{% elif hint_id %}{{ hint_id }}{% elif error %}{{ anchor }}-error{% endif -%}
{%- endmacro %}

{% macro tile_group(legend, hint, hint_id, name, options, control, columns, anchor, error) -%}
<fieldset class="wo-fieldset">
<legend class="wo-legend">{{ legend }}</legend>
{% if hint %}
<p class="wo-hint" id="{{ hint_id }}">{{ hint }}</p>
{% endif %}
{{ tiles(name, options, control, columns, anchor, described_by(hint_id if hint else "", anchor, error) | trim, error is not none) }}
{% if error %}
{{ field_error(anchor, error.message) }}
{% endif %}
</fieldset>
{%- endmacro %}

{% macro who(page) -%}
{{ tile_group(copy.WHO_LEGEND, "", "", "who", page.who, "radio", "two", "who-first",
              page.field_errors.get("who")) }}
{%- endmacro %}

{% macro ages(page) -%}
{{ tile_group(copy.AGES_LEGEND, copy.AGES_HINT, "ages-hint", "age_band", page.ages,
              "checkbox", "four", "age-first", page.field_errors.get("age_band")) }}
{%- endmacro %}

{% macro time_budget(page) -%}
{{ tile_group(copy.TIME_LEGEND, copy.TIME_HINT, "time-hint", "time", page.time, "radio", "four",
              "time-first", page.field_errors.get("time")) }}
{%- endmacro %}

{% macro energy(page) -%}
{# TC-001: the values stay gentle / moderate / energetic, the labels read Gentle /
   Moderate / High. Both come from the Option view model, never from this template. #}
{{ tile_group(copy.ENERGY_LEGEND, copy.ENERGY_HINT, "energy-hint", "energy", page.energy,
              "radio", "three", "energy-first", page.field_errors.get("energy")) }}
{%- endmacro %}

{% macro where(page) -%}
<fieldset class="wo-fieldset">
<legend class="wo-legend">{{ copy.WHERE_LEGEND }}</legend>
{% if page.coords and page.location_label %}
<p class="wo-carried">{{ page.location_label }}{{ copy.CARRIED_LOCATION_SUFFIX }}</p>
{% endif %}
{# The board puts the town field and the location button on one row, with the field's
   own label above them both. #}
<label class="wo-field-label" for="place">{{ copy.CARRIED_LOCATION_ALTERNATIVE if page.coords and page.location_label else copy.PLACE_LABEL }}</label>
<div class="wo-location-row">
{{ bare_text_field("place", "place", page.place, "place-hint",
                   page.field_errors.get("place"), 80, "address-level2") }}
{# TC-011: rendered hidden and shown by location.js, so a button that cannot work is never
   offered. The browser is asked on click; the rounded coordinates go into this form's
   hidden fields and travel with the ordinary submit. The status line carries its own
   wording as data attributes, so the script holds no copy. #}
<button class="wo-btn wo-btn-secondary" type="button" data-wo-locate aria-describedby="locate-status" hidden>{{ icon("location-pin") }}{{ copy.USE_MY_LOCATION }}</button>
</div>
<p class="wo-hint" id="place-hint">{{ page.place_hint }}</p>
<p class="wo-hint wo-locate-status" id="locate-status" role="status" data-wo-locate-status data-asking="{{ copy.LOCATION_ASKING }}" data-using="{{ copy.LOCATION_USING }}" data-denied="{{ copy.LOCATION_DENIED }}" data-failed="{{ copy.LOCATION_FAILED }}" hidden></p>
</fieldset>
{%- endmacro %}

{% macro interests(page) -%}
{% if page.interests_text is not none %}
{% set chosen = page.who | selectattr("checked") | map(attribute="value") | list %}
{% set legend = copy.INTERESTS_LEGEND_BY_WHO["solo" if "solo" in chosen else "kids"] %}
<fieldset class="wo-fieldset">
<legend class="wo-legend">{{ legend }} <span class="wo-soft">{{ copy.INTERESTS_OPTIONAL }}</span></legend>
<p class="wo-hint" id="interests-hint">{{ copy.INTERESTS_HINT }}</p>
{{ text_field("interests_text", "interests", legend, page.interests_text, "",
              "interests-hint", page.field_errors.get("interests_text"), 120, "off",
              "wo-vh") }}
</fieldset>
{% endif %}
{%- endmacro %}

{% macro info_use() -%}
{# The detailed provider and cache explanations, in a native disclosure so the hints
   beside the fields stay short. Works without JavaScript; reuses the results page's
   disclosure styles. #}
<details class="wo-change wo-info-use">
<summary class="wo-change-summary">{{ copy.INFO_USE_SUMMARY }}</summary>
<p class="wo-hint">{{ copy.INFO_USE_LOCATION }}</p>
<p class="wo-hint">{{ copy.INFO_USE_INTERESTS }}</p>
<p class="wo-hint">{{ copy.INFO_USE_LOGS }}</p>
</details>
{%- endmacro %}

{% macro extras(page) -%}
{# D42: two controls with different effects. Step-free is a preference, never a filter. #}
<fieldset class="wo-fieldset wo-extras">
<legend class="wo-vh">{{ copy.OPTIONAL_SUMMARY }}</legend>
<label class="wo-checkrow"><input type="checkbox" name="stroller" value="1"{% if page.stroller %} checked{% endif %}><span>{{ copy.STROLLER_LABEL }}</span></label>
<label class="wo-checkrow"><input type="checkbox" name="step_free" value="1" aria-describedby="step-free-hint"{% if page.step_free %} checked{% endif %}><span>{{ copy.STEP_FREE_LABEL }}</span></label>
<p class="wo-hint" id="step-free-hint">{{ copy.STEP_FREE_HINT }}</p>
</fieldset>
{%- endmacro %}

{% macro honeypot() -%}
{# D49, DEPLOYMENT section 4: present in every plan form, hidden from keyboard and
   screen readers, excluded from the fingerprint. #}
<div class="wo-vh" aria-hidden="true"><label for="hp_note">{{ copy.HONEYPOT_LABEL }}</label><input type="text" id="hp_note" name="hp_note" value="" tabindex="-1" autocomplete="off"></div>
{%- endmacro %}

{% macro plan_form(page) -%}
{# The whole plan form, in one place, because the form page and the "Change answers"
   disclosure on the results page must post exactly the same fields (D46, CONTRACTS
   section 7): same hidden state, same honeypot, same keyboard order. #}
<form class="wo-panel wo-plan-form" method="post" action="/plan" novalidate data-wo-pending>
<input type="hidden" name="csrf_token" value="{{ page.session.csrf_token }}">
{% if page.session.idempotency_key %}
<input type="hidden" name="idempotency_key" value="{{ page.session.idempotency_key }}">
{% endif %}
<input type="hidden" name="location_mode" value="{{ page.location_mode }}">
{% if page.coords %}
<input type="hidden" name="lat" value="{{ page.coords[0] }}">
<input type="hidden" name="lon" value="{{ page.coords[1] }}">
{% endif %}
{% if page.location_label %}
<input type="hidden" name="location_label" value="{{ page.location_label }}">
{% endif %}
{{ honeypot() }}
{{ error_summary(page.summary) }}
{{ who(page) }}
{{ ages(page) }}
{{ time_budget(page) }}
{{ energy(page) }}
{{ where(page) }}
{{ interests(page) }}
{{ info_use() }}
{{ extras(page) }}
<div class="wo-actions">
<button class="wo-btn wo-btn-primary" type="submit">{{ copy.SUBMIT }}<span class="wo-btn-arrow" aria-hidden="true">→</span></button>
</div>
{{ loader() }}
</form>
{%- endmacro %}

{% macro loader() -%}
{# D43, TC-011: the busy state is static markup, hidden until location.js reveals it on an
   explicit submit and never on page load. The badge and the moving bar are decorative;
   the status region is empty until the script fills it once, so nothing is announced
   twice. Without JavaScript the browser's own loading state shows instead. #}
<div class="wo-busy wo-loader" data-wo-loader hidden>
<p class="wo-loader-badge" aria-hidden="true">{{ copy.LOADER_BADGE }}</p>
<div class="wo-loader-track" aria-hidden="true"><div class="wo-loader-bar"></div></div>
<p class="wo-loader-text" role="status" aria-live="polite" data-wo-loader-status data-message="{{ copy.LOADER_TEXT }}"></p>
</div>
{%- endmacro %}

{% macro location_choice(page) -%}
{% if page.candidates %}
{# BACKEND-CONTRACT section 3: at most five candidates; the town field stays editable. #}
{# TC-011: its own heading and its own button, so the list reads as the one question on
   this page and never as part of the form below, which stays for changing answers. #}
<form class="wo-panel wo-choice-form" method="post" action="/location-choice" aria-labelledby="choice-heading" data-wo-pending>
<input type="hidden" name="csrf_token" value="{{ page.session.csrf_token }}">
<h2 class="wo-choice-heading" id="choice-heading">{{ copy.LOCATION_CHOICE_HEADING }}</h2>
<p class="wo-hint wo-choice-intro">{{ copy.LOCATION_CHOICE_INTRO }}</p>
<fieldset class="wo-fieldset">
<legend class="wo-legend wo-vh">{{ copy.LOCATION_CHOICE_LEGEND }}</legend>
{% if page.candidates_expire_at %}
<p class="wo-hint" id="candidates-hint">{{ copy.LOCATION_CHOICE_EXPIRES.format(time=page.candidates_expire_at) }}</p>
{% endif %}
{{ tiles("candidate_id", page.candidates, "radio", "one", "candidate-first",
         "candidates-hint" if page.candidates_expire_at else "", false) }}
</fieldset>
<div class="wo-actions">
<button class="wo-btn wo-btn-primary" type="submit">{{ copy.USE_THIS_PLACE }}<span class="wo-btn-arrow" aria-hidden="true">→</span></button>
</div>
{{ loader() }}
</form>
{% endif %}
{%- endmacro %}
