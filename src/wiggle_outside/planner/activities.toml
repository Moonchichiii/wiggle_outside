# Wiggle Outside activity catalogue: baseline 8.20. Mats's per-item answers to
# CATALOGUE-REVIEW §6 are applied (26 entries: 19 kids, 7 solo). Thresholds are product
# assumptions, not safety guarantees (D14).
# Gemma only ranks activity-place pairs built from this file and picks reviewed hooks
# (hooks.toml). Steps, optional items, adaptations, question and safety note render verbatim.
#
# Shared rules applied by code to every entry:
# - Kids entries assume an adult is present and nearby. That does not make an entry
#   suitable for every child in a band; the adult decides.
# - With several age bands selected, an entry qualifies only if it lists every band.
# - Nothing is eaten, picked from living plants or taken home. Loose fallen leaves and sticks
#   may be moved a short way and left on site; stones and logs are never lifted or moved.
# - Activities never take place at water edges, beside traffic or at heights. Walking on
#   ordinary pavements to reach a place is travel, not the activity. Place kinds
#   "viewpoint" and "beach" are not used in v1. These are instructions and data filters;
#   the app cannot verify that a park has no pond, slope or road.
# - Weather: severe weather and the global heat rule (PLAN section 3) exclude everything.
#   Per-entry limits apply on top. All limits are product assumptions, not established
#   safety thresholds. Every kids' entry is daylight-only (W4); a family run outside
#   daylight gets the fixed night copy (BACKEND-CONTRACT §1).
#   Missing or stale weather means no recommendation (D16).
# - Nothing is required beyond everyday clothes; every `optional` item names an alternative.
# - minutes[min] is long enough for the steps as written.
#
# Fields: who = solo | kids; ages = 0-2, 3-5, 6-9, 10-12 (kids only);
# energy = levels the activity suits; the quiz value is a ceiling (D18);
# places = OSM kinds or "any"; generic_ok = may be offered with no destination (all other
# constraints still apply: age, energy, weather, daylight, season, time);
# interests = D39 tags (vocabulary in PRODUCT-FIT section 3); used only if D39 is accepted,
# reviewed by Mats; at most three per entry; ranking preference only, never eligibility;
# card = optional, exactly 9 short items shown as a 3 × 3 grid on the detail and print view;
# minutes = [min, max] on site, travel excluded; rain_ok, max_rain_pct, min_temp_c,
# max_wind_kmh, daylight; max_temp_c is optional (only when lower than the global rule);
# activity_suits_stroller describes the activity only, never the route or place access;
# seasons (empty = all year; computed from date and hemisphere of the rounded location); optional; steps; adapt (alternatives for sight, hearing or
# mobility); ask (kids only); safety.

[[activity]]
id = "leaf-colour-hunt"
title = "Leaf colour hunt"
who = "kids"
ages = ["3-5", "6-9"]
energy = ["gentle", "moderate"]
places = ["park", "forest", "nature_reserve"]
generic_ok = false
interests = ["colours", "trees"]
minutes = [20, 45]
rain_ok = true
max_rain_pct = 70
min_temp_c = 0
max_wind_kmh = 30
daylight = true
activity_suits_stroller = true
seasons = ["autumn"]
optional = ["a small bag for fallen leaves (or just make the row on the ground)"]
steps = [
  "Pick three colours together before you start: red, yellow, brown.",
  "Look for one fallen leaf of each colour.",
  "Lay them in a row from lightest to darkest.",
  "Leave them in a little pattern on the ground before you go home.",
]
adapt = "Compare leaves by feel instead: smooth, crinkly, soft."
ask = "Which colour was the hardest to find, and why do you think that is?"
safety = "Fallen leaves only. Wash hands before snacks."

