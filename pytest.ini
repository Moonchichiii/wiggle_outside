; PLAN section 8: strict markers and config, warnings as errors, random order,
; 5 s timeout, no real HTTP (enforced in tests/conftest.py).
[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers --strict-config -ra
filterwarnings = error
timeout = 5
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    contract: asserts a CONTRACTS.md shape; runs on every package branch
